name: decode-images
on:
  push:
    branches: [main]
    paths: ['incoming/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-images
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode incoming/*.b64 into images/*.png and incoming/*.mp4.b64 into videos/*.mp4
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p images videos
          files=(incoming/*.b64)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to decode"; exit 0; fi
          for f in "${files[@]}"; do
            base=$(basename "$f" .b64)
            if [[ "$base" == *.mp4 ]]; then
              out="videos/${base}"
              tr -d ' \r\n' < "$f" | base64 -d > "$out"
              [ "$(head -c 8 "$out" | tail -c 4)" = "ftyp" ] || { echo "not an MP4: $f"; exit 1; }
            else
              out="images/${base}.png"
              tr -d ' \r\n' < "$f" | base64 -d > "$out"
              head -c 8 "$out" | od -An -tx1 | tr -d ' \n' | grep -q '^89504e470d0a1a0a$' || { echo "not a PNG: $f"; exit 1; }
            fi
            sha256sum "$out"
            git rm -q "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images videos
          git commit -m "Decode media"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 3; done
